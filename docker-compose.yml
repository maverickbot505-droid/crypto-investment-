version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: investment_postgres
    environment:
      - POSTGRES_USER=
      - POSTGRES_PASSWORD=
      - POSTGRES_DB=
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - ":5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U "]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: investment_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: investment_app
    environment:
      - NODE_ENV=
      - DATABASE_URL=postgresql://:@postgres:5432/
      - NEXTAUTH_URL=
      - JWT_SECRET=
      - SMTP_HOST=
      - SMTP_PORT=
      - SMTP_USER=
      - SMTP_PASS=
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  adminer:
    image: adminer:latest
    container_name: investment_adminer
    environment:
      - ADMINER_DEFAULT_SERVER=investment_postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
